# Sized for a 16 GB dev machine: the template's 8 GB heap + 4 GB metaspace ran the PC out of
# memory during release builds (R8 + obfuscation) when other apps were open.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
